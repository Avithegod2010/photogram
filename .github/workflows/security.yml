name: Security

# Runs the same two checks the audit used, so the findings cannot quietly come back.
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secrets:
    name: Secret scan (full history)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks 8.30.1
        # Pinned by release URL, not a movable action tag.
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            | tar -xz gitleaks
          ./gitleaks git . --log-opts="--all" --redact --no-banner --exit-code 1


  dependencies:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: npm audit (high and above)
        run: |
          if [ -f package-lock.json ]; then
            npm audit --package-lock-only --audit-level=high
          else
            echo "No lockfile committed — skipping (install resolution is nondeterministic)."
          fi
