name: CI

# Type-checks every push. The review probe lives in .expo/ (gitignored) by design,
# so it stays a local gate - this workflow is the safety net for everyone else.
on:
  push:
    branches: [master]
  pull_request:

jobs:
  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --include=dev

      - name: Probe + static checks + typecheck
        run: npm run probe
